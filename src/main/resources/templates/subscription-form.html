<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add subscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-head">
        <h1 th:text="${editId != null} ? 'Edit subscription' : 'Add subscription'">Add subscription</h1>
    </div>
    <div class="form-card">
        <form class="form">
            <div class="field">
                <label for="name">Provider</label>
                <input type="text" id="name" name="name" placeholder="Netflix" required/>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required/>
                </div>
                <div class="field">
                    <label for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId" required>
                        <option value="">Choose a category</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="cycle">Billing cycle</label>
                    <select id="cycle" name="cycle">
                        <option value="MONTHLY">Monthly</option>
                        <option value="YEARLY">Yearly</option>
                    </select>
                </div>
                <div class="field">
                    <label for="nextPayment">Next payment</label>
                    <input type="date" id="nextPayment" name="nextPayment" required/>
                </div>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="freeTrial" name="freeTrial"/>
                    <span>Free trial</span>
                </label>
            </div>

            <div class="form-actions">
                <a th:href="@{/subscriptions}" class="link">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/subscription-form.js}"></script>
</body>
</html>
