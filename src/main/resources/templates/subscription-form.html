<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add subscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">

    <div class="page-head">
        <h1 th:text="${editId != null} ? 'Edit subscription' : 'Add subscription'"></h1>
    </div>
    <div class="form-card">
        <form th:action="${editId != null} ? @{/subscriptions/{id}(id=${editId})} : @{/subscriptions}" method="post"
              class="form">
            <div class="field">
                <label for="providerId">Provider</label>
                <div class="provider-picker" th:if="${editId == null}">
                    <input class="provider-value" id="providerId" name="providerId" type="hidden" required/>
                    <div class="provider-combobox">
                        <button class="provider-combo" id="providerCombo" type="button" aria-haspopup="listbox"
                                aria-expanded="false" aria-controls="providerOptions">
                            <span class="provider-current" id="providerCurrent">
                                <span class="provider-placeholder">Choose a provider</span>
                            </span>
                            <span class="provider-chevron" aria-hidden="true">▾</span>
                        </button>
                        <div class="provider-options" id="providerOptions" role="listbox" hidden>
                            <button th:each="p : ${providers}" class="provider-option" type="button" role="option"
                                    th:data-provider-id="${p.id}" th:data-provider-name="${p.name}"
                                    th:data-logo-path="${p.logoPath}" aria-selected="false">
                                <img th:if="${p.logoPath != null and !#strings.isEmpty(p.logoPath)}"
                                     class="provider-option-logo" th:src="${p.logoPath}" alt=""/>
                                <span th:unless="${p.logoPath != null and !#strings.isEmpty(p.logoPath)}"
                                      class="provider-option-initial" aria-hidden="true"
                                      th:text="${#strings.substring(p.name, 0, 1).toUpperCase()}"></span>
                                <span th:text="${p.name}"></span>
                            </button>
                        </div>
                    </div>
                </div>
                <input type="text" th:if="${editId != null}" th:value="${sub.providerName}" readonly/>
                <p class="field-help" th:if="${editId == null}">
                    Can't find your provider? <a th:href="@{/providers/new}" class="link">Add your own</a>
                </p>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" required
                           th:value="${sub != null ? sub.price : ''}"/>
                </div>
                <div class="field" th:if="${editId == null}">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency">
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
                <div class="field">
                    <label for="billingCycle">Billing cycle</label>
                    <select id="billingCycle" name="billingCycle">
                        <option value="MONTHLY" th:selected="${sub != null and sub.billingCycle.name() == 'MONTHLY'}">
                            Monthly
                        </option>
                        <option value="YEARLY" th:selected="${sub != null and sub.billingCycle.name() == 'YEARLY'}">
                            Yearly
                        </option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="nextPaymentDate">Next payment</label>
                <input type="date" id="nextPaymentDate" name="nextPaymentDate" required
                       th:value="${sub != null ? sub.nextPaymentDate : ''}"/>
            </div>

            <div class="field" th:if="${editId == null}">
                <label for="maxParticipants">
                    Maximum participants
                </label>

                <input
                        type="number"
                        id="maxParticipants"
                        name="maxParticipants"
                        min="1"
                        step="1"
                        value="1"
                        required
                />

                <p class="field-help">
                    1 = individual subscription.
                    2 or more = shared subscription.
                    Includes the owner.
                </p>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="freeTrial" name="freeTrial" value="true"
                           th:checked="${sub != null and sub.freeTrial}"/>
                    <span>Free trial</span>
                </label>
            </div>

            <div class="form-actions">
                <a th:href="@{/subscriptions}" class="link">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/subscription-form.js}" defer></script>
</body>
</html>
