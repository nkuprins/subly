<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add subscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-head">
        <h1>Add subscription</h1>
    </div>
    <div class="form-card">
        <form th:action="@{/subscriptions}" method="post" class="form">
            <div class="field">
                <label for="name">Service</label>
                <input type="text" id="name" name="name" placeholder="Netflix" required/>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required/>
                </div>
                <div class="field">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency">
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="cycle">Billing cycle</label>
                    <select id="cycle" name="cycle">
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="field">
                    <label for="nextPayment">Next Payment</label>
                    <input type="date" id="nextPayment" name="nextPayment" required/>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/subscriptions}" class="link">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
