<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add subscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">

    <div class="page-head">
        <h1 th:text="${editId != null} ? 'Edit subscription' : 'Add subscription'"></h1>
    </div>
    <div class="form-card">
        <form th:action="${editId != null} ? @{/subscriptions/{id}(id=${editId})} : @{/subscriptions}" method="post"
              class="form">
            <div class="field">
                <label for="providerId">Provider</label>
                <select id="providerId" name="providerId" th:if="${editId == null}" required>
                    <option value="">Choose a provider</option>
                    <option th:each="p : ${providers}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
                <input type="text" th:if="${editId != null}" th:value="${sub.providerName}" readonly/>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" required
                           th:value="${sub != null ? sub.price : ''}"/>
                </div>
                <div class="field">
                    <label for="billingCycle">Billing cycle</label>
                    <select id="billingCycle" name="billingCycle">
                        <option value="MONTHLY" th:selected="${sub != null and sub.billingCycle.name() == 'MONTHLY'}">
                            Monthly
                        </option>
                        <option value="YEARLY" th:selected="${sub != null and sub.billingCycle.name() == 'YEARLY'}">
                            Yearly
                        </option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="nextPaymentDate">Next payment</label>
                <input type="date" id="nextPaymentDate" name="nextPaymentDate" required
                       th:value="${sub != null ? sub.nextPaymentDate : ''}"/>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="freeTrial" name="freeTrial" value="true"
                           th:checked="${sub != null and sub.freeTrial}"/>
                    <span>Free trial</span>
                </label>
            </div>

            <div class="form-actions">
                <a th:href="@{/subscriptions}" class="link">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>git commit --no-edit
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
