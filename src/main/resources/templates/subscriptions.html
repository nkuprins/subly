<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Subscriptions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-head">
        <h1>Subscriptions</h1>
        <span class="spacer"></span>
        <a th:href="@{/subscriptions/new}" class="btn btn-primary">+ Add Subscription</a>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Provider</th>
                <th>Price</th>
                <th>Currency</th>
                <th>Cycle</th>
                <th>Next payment</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${subscriptions}">
                <td th:text="${item.subscription.providerName()}"></td>
                <td th:text="${item.subscription.price}"></td>
                <td th:text="${item.subscription.currency}"></td>
                <td>
            <span class="pill"
                  th:classappend="${item.subscription.billingCycle.name() == 'YEARLY'} ? ' pill-year'"
                  th:text="${item.subscription.billingCycle}"></span>
                </td>
                <td th:text="${item.subscription.nextPaymentDate}"></td>
                <td>
                    <div class="actions">
                        <a
                                th:href="@{/subscriptions/{id}/edit(id=${item.subscription.id})}" class="link">Edit</a>
                        <a th:href="@{/subscriptions/{id}/invite(id=${item.subscription.id})}" class="link">Invite</a>
                        <form
                                th:action="@{/subscriptions/{id}/delete(id=${item.subscription.id})}" method="post"
                                onsubmit="return confirm('Delete this subscription?');" class="inline-form">
                            <button type="submit" class="link link-danger btn-link">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(subscriptions)}">
                <td colspan="6" class="empty-row">
                    No subscriptions yet. <a th:href="@{/subscriptions/new}" class="link">Add one</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
