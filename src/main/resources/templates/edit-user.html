<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Subly - Edit profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page edit-user-page">
    <h1>Edit profile</h1>
    <p class="muted">Manage your password and personal information.</p>

    <section class="panel edit-user-section">
        <h2>Password</h2>
        <form id="password-form" class="form" novalidate>
            <div class="field">
                <label for="old-password">Current password</label>
                <input id="old-password" name="oldPassword" type="password" autocomplete="current-password" required/>
            </div>
            <div class="field">
                <label for="new-password">New password</label>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required/>
            </div>
            <div class="form-actions">
                <button id="password-submit" class="btn btn-primary" type="submit" disabled>Change</button>
            </div>
            <p class="edit-user-message" id="password-message" role="status" aria-live="polite"></p>
        </form>
    </section>

    <section class="panel edit-user-section">
        <h2>Information</h2>
        <form id="information-form" class="form" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="newUsername" type="text" min="1" maxlength="100" th:value="${user.username}" required/>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="newEmail" type="email" min="1" th:value="${user.email}" required/>
            </div>
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="newName" type="text" min="1" maxlength="100" th:value="${user.name}" required/>
            </div>
            <div class="field">
                <label for="time-zone">Time zone</label>
                <select id="time-zone" name="newTimeZone" required>
                    <option th:each="zone : ${timeZones}" th:value="${zone}" th:text="${zone}"
                            th:selected="${zone == user.timeZone.id}"></option>
                </select>
            </div>
            <div class="form-actions">
                <button id="information-submit" class="btn btn-primary" type="submit" disabled>Save</button>
            </div>
            <p class="edit-user-message" id="information-message" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
<dialog class="edit-user-dialog" id="edit-user-dialog" aria-labelledby="edit-user-dialog-title">
    <div class="edit-user-dialog-card">
        <button class="edit-user-dialog-close" id="edit-user-dialog-close" type="button" aria-label="Close">&times;</button>
        <h2 id="edit-user-dialog-title"></h2>
        <p id="edit-user-dialog-message"></p>
        <button class="btn btn-primary" id="edit-user-dialog-ok" type="button">OK</button>
    </div>
</dialog>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/edit-user.js}"></script>
</body>
</html>
