<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <h1>History</h1>
    <p class="muted">Cancelled subscriptions that have ended</p>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Provider</th>
                <th>Price</th>
                <th>Ended on</th>
                <th>Role</th>
                <th>Saved</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${history}">
                <td th:text="${item.subscription.providerName()}"></td>
                <td th:text="|${item.subscription.price} ${item.subscription.currency}|"></td>
                <td th:text="${item.endedOn}"></td>
                <td th:text="${item.role}"></td>
                <td th:text="|${item.saved} ${item.subscription.currency}|"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="5" class="empty-row">No ended subscriptions yet</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
