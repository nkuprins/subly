spring:
  application:
    name: subly
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/subly}
    username: ${DB_USERNAME:subly}
    password: ${DB_PASSWORD:subly}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        order_updates: true
        jdbc:
          batch_size: 50
app:
  admin-settings:
    admin-username: admin
    admin-name: admin
    admin-password: test_admin_subly_12345
    admin-email: admin@admin.com
server:
  servlet:
    session:
      timeout: 30m