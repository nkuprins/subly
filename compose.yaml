services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: subly
      MYSQL_USER: subly
      MYSQL_PASSWORD: subly
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
