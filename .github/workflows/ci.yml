name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: subly
          MYSQL_USER: subly
          MYSQL_PASSWORD: subly
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # Wait until MySQL accepts connections before the tests start
        options: >-
          --health-cmd="mysqladmin ping -usubly -psubly"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
